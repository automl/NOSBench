[project]
name = "nosbench"
version = "0.1.0"
description = "NOSBench-101: Towards Reproducible Neural Optimizer Search"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "torch>=2.1.0",
  "scikit-learn>=1.3.2",
  "numpy>=1.26.1",
  "configspace==1.2.0",
  "filelock>=3.13.0"
]

[dependency-groups]
dev = [
    "setuptools>=75.8.0",
]

